name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      # Stacked PRs that target the SDK 58 alignment branch (before it merges to main).
      - cursor/align-expo-sdk-58-deps-e962

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Export for web
        run: npx expo export --platform web

      - name: Export for Android
        run: npx expo export --platform android
